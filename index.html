<!DOCTYPE html>
<html lang="id">
<head>
    <title>My First Website RPL</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial;
            color: white;
            background: linear-gradient(45deg, #667eea, #764ba2, #ff758c);
        }
        .card {
            width: 300px;
            padding: 30px;
            background: #ffffff33;
            border-radius: 25px;
        }
        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
        }

        h1 {
            margin-top: 20px;
        }

        .typing {
            color: #ffeaa7;
        }

        p {
            line-height: 1.5;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        button:hover {
            background: #ffeaa7;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="putri.JPG">
        <h1>Putri Valentina Bakkara</h1>
        <h3 class="typing">Future Programmer 🚀</h3>
        <p>
            Saya belajar coding untuk membuat
            website, aplikasi, dan teknologi keren.
        </p>
        <button onclick="kenalan()">Mulai Coding</button>
    </div>
    <script>
        function kenalan() {
            alert("Selamat datang di dunia RPL 🚀");
        }
    </script>
</body>
</html>
