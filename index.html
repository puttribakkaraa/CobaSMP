<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Website RPL</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
    background:
    linear-gradient(
    45deg,
    #667eea,
    #764ba2,
    #ff758c
    );
    background-size:300% 300%;
    animation:bg 8s infinite alternate;
    overflow:hidden;
}
/* background animation */
@keyframes bg{
    0%{
        background-position:left;
    }
    100%{
        background-position:right;
    }
}
/* kartu */
.card{
    width:350px;
    padding:30px;
    text-align:center;
    color:white;
    background: rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow: 0 20px 40px rgba(0,0,0,.3);
    animation: naik 1.5s;
}
@keyframes naik{
    from{
        opacity:0;
        transform:
        translateY(100px);
    }
    to{
        opacity:1;
        transform:
        translateY(0);}
}
img{ width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid white;
    animation: melayang 3s infinite;
}
@keyframes melayang{ 50%{
        transform:
        translateY(-15px);
    }

}
h1{ margin-top:20px;
}
.typing{
    margin-top:10px;
    color:#ffeaa7;
}
p{ margin-top:20px;
    line-height:1.5;
}
button{
    margin-top:25px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}
button:hover{
    transform:
    scale(1.15);
    background:#ffeaa7;
}
</style>
</head>
<body>
<div class="card">
<img src="https://i.pravatar.cc/200">
<h1>Andi </h1>
<h3 class="typing">Future Programmer 🚀</h3>
<p>Saya belajar coding untuk membuat website, aplikasi, dan teknologi keren.</p>
<button onclick="kenalan()">Mulai Coding</button>
</div>
<script>
function kenalan(){
alert(
"Selamat datang di dunia RPL 🚀");}
</script>
</body>
</html>
